name: Diagnostic release

# Lance l'APK de diffusion (signée, R8, obfusquée) sur un émulateur Android et
# garde le journal système et une capture d'écran : sert quand la version de
# diffusion se comporte autrement que l'APK de contrôle en debug.
on:
  workflow_dispatch:
  push:
    branches: ["lot-4-confort"]
    paths:
      - ".github/workflows/diagnostic-release.yml"
      - "app/android/**"

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  emulateur:
    name: APK de diffusion sur émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Keystore depuis les secrets du dépôt
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iacaveavin-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/iacaveavin-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > app/android/key.properties
      - name: Build APK de diffusion (comme la release)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
      - name: Effacer le keystore du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/iacaveavin-upload.jks" app/android/key.properties
      - name: Autoriser KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Lancement sur émulateur, journal et capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am start -W -n fr.apexus.iacaveavin/.MainActivity
            sleep 40
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > ecran.png
            echo "=== Erreurs de l'app ==="
            grep -E "FATAL EXCEPTION|Unhandled Exception|E flutter|AndroidRuntime" logcat.txt | head -100 || true
            if grep -qE "FATAL EXCEPTION|Unhandled Exception" logcat.txt; then echo "ÉCHEC : l'app plante au démarrage"; exit 1; fi
            adb shell pidof fr.apexus.iacaveavin || (echo "ÉCHEC : l'app n'est plus lancée"; exit 1)
            echo "Démarrage sans erreur" 
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-release
          path: |
            logcat.txt
            ecran.png
            app/build/app/outputs/mapping/release/mapping.txt
          retention-days: 7
