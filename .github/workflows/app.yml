name: Application

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Release à la main depuis l'onglet Actions (« Run workflow » sur main) :
  # crée le tag et la release, utile quand le tag ne peut pas être poussé.
  workflow_dispatch:
    inputs:
      version:
        description: "Tag de la release, égal à la version de pubspec.yaml (ex. v1.0.0)"
        required: true

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  verifier:
    name: Analyse, tests et APK de contrôle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - name: Contrat n8n
        run: python3 scripts/valider_contrat.py
      - name: Règles de garde et dictionnaire
        run: python3 scripts/verifier_regles.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        working-directory: app
        run: flutter pub get
      - name: Code généré à jour (drift, l10n, jetons de thème)
        working-directory: app
        run: |
          dart run build_runner build
          flutter gen-l10n
          dart run tool/generate_theme_tokens.dart
          python3 ../scripts/generer_referentiels.py
          git diff --exit-code -- . ../app/assets || (echo "Code généré obsolète : relancer les générateurs et commiter" && exit 1)
      - name: Formatage
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - name: Analyse (zéro avertissement)
        working-directory: app
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Tests unitaires et widgets
        working-directory: app
        run: flutter test --coverage
      - name: Matrice des exigences (lots 0, 1, 2a et 2c couverts)
        run: |
          python3 scripts/matrice_exigences.py --lot 0
          python3 scripts/matrice_exigences.py --lot 1
          python3 scripts/matrice_exigences.py --lot 2a
          python3 scripts/matrice_exigences.py --lot 2c
      - name: Build APK de contrôle (debug, non diffusable)
        working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug-controle
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  release:
    name: APK et AAB signés, release GitHub
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag conforme à la version de pubspec.yaml
        run: |
          attendu="v$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' app/pubspec.yaml)"
          if [ "$TAG" != "$attendu" ]; then echo "Tag $TAG différent de la version $attendu de pubspec.yaml"; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Keystore depuis les secrets du dépôt
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Secret $v manquant (voir app/README.md, Signature)"; exit 1; fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iacaveavin-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/iacaveavin-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > app/android/key.properties
      - name: Build APK release (obfusqué, NFR-06)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk "build/iacaveavin-${TAG}.apk"
      - name: Build AAB release pour Google Play (obfusqué, même clé d'envoi)
        working-directory: app
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols-aab
          cp build/app/outputs/bundle/release/app-release.aab "build/iacaveavin-${TAG}.aab"
          (cd build && zip -qr "iacaveavin-${TAG}-symboles.zip" symbols-aab)
      - name: Effacer le keystore du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/iacaveavin-upload.jks" app/android/key.properties
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            app/build/iacaveavin-${{ env.TAG }}.apk
            app/build/iacaveavin-${{ env.TAG }}.aab
            app/build/iacaveavin-${{ env.TAG }}-symboles.zip
          generate_release_notes: true
