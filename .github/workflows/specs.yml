name: Spécifications

on:
  push:
    paths: ["specs/**", "scripts/**", "n8n/**", ".github/workflows/specs.yml"]
  pull_request:
    paths: ["specs/**", "scripts/**", "n8n/**", ".github/workflows/specs.yml"]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - name: Contrat n8n (schémas, exemples, cas de rejet)
        run: python3 scripts/valider_contrat.py
      - name: Règles de garde et dictionnaire de données
        run: python3 scripts/verifier_regles.py
      - name: Aucun secret dans les exports de flux n8n
        run: |
          if grep -RInE '("apiKey"|"password"|"secret"|Bearer [A-Za-z0-9]{20,}|tvly-[A-Za-z0-9_-]{10,}|sk-ant-|dev-[A-Za-z0-9_-]{20,})' n8n/workflow 2>/dev/null; then
            echo "Secret probable dans n8n/workflow" && exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Nœuds Code du flux n8n (tests node)
        run: node --test n8n/code/test/*.test.js
      - name: Validateur JS des nœuds identique à jsonschema
        run: python3 n8n/code/test/schema_croise.py
      - name: Exports de flux conformes au code du dépôt
        run: for f in n8n/workflow/IA_CAVE_*.json; do node n8n/code/comparer.js "$f"; done
      - name: Script du jeu d'essai (signature et comparaisons, sans réseau)
        run: python3 scripts/jeu_essai.py --auto-test
